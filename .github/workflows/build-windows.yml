name: Build Brahma Evo Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - "Brahma-Ai-Evo-main/**"
      - ".github/workflows/build-windows.yml"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: brahma-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Brahma-Ai-Evo-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Build desktop application
        run: pyinstaller --noconfirm --clean installer/BrahmaEvo.spec
      - name: Build Windows installer
        run: pyinstaller --noconfirm --clean installer/BrahmaEvo_Setup.spec
      - uses: actions/upload-artifact@v4
        with:
          name: Brahma-Evo-Windows-Setup
          path: Brahma-Ai-Evo-main/dist/Brahma-evo-enhanced-version.exe
          if-no-files-found: error
      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Brahma-Ai-Evo-main/dist/Brahma-evo-enhanced-version.exe
          fail_on_unmatched_files: true