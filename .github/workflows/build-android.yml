name: Build Brahma-Evo-V3 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Brahma-Ai-Evo-main/brahma-connect-android/**"
      - ".github/workflows/build-android.yml"
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Brahma-Ai-Evo-main/brahma-connect-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable debug APK
        run: bash gradlew --no-daemon --stacktrace assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Brahma-Evo-V3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Brahma-Evo-V3-APK
          path: Brahma-Ai-Evo-main/brahma-connect-android/app/build/outputs/apk/debug/Brahma-Evo-V3.apk
          if-no-files-found: error
      - name: Publish GitHub Release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: Brahma-Ai-Evo-main/brahma-connect-android/app/build/outputs/apk/debug/Brahma-Evo-V3.apk
          fail_on_unmatched_files: true
